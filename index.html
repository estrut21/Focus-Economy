<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Focus Economy</title>
    </head>
    <body>
        <main class="container">
            <h1> Focus Economy </h1>
        <p> Your attention is like money. 
            Trade your focus for coins while being able
            to invest in your own productivity.
        </p>
        </div>
       <section class="wallet">
        <h2> Wallet </h2>
        <p id="cointBalance"> 0 Coins </p>
       </section>

       <section class="timer">
         <h2 id="timerDisplay"> 25:00 </h2>  
       </section>

       <section class="controls">
        <button id="startButton"> Start </button>
        <button id="pauseButton"> Pause </button>
        <button id="resetButton"> Reset </button>
       </section>

       <section class="coinJar">
        <h2> Coin Jar </h2>
       </section>

       <section class="tasks">
        <h2> Task </h2>
        <p> Complete one session and gain 10 coins</p>
       </section>
       </main>

       <script src="script.js"></script>
    </body>
</html>
